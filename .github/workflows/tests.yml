name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: pip install pytest numpy scipy

      # Each project is collected on its own, from inside its folder, the
      # same way each one ran as a standalone repository. Several projects
      # share module names (fx_application.py, linear_algebra.py), so a
      # single pytest run from the root would import the wrong module.
      - name: Run every project's test suite
        run: |
          status=0
          for d in $(find . -mindepth 2 -maxdepth 2 -type d -path './phase*' | sort); do
            echo "::group::$d"
            (cd "$d" && python -m pytest --tb=short -q) || { echo "::error::tests failed in $d"; status=1; }
            echo "::endgroup::"
          done
          exit $status

      - name: Run oracle verification for every project
        run: |
          status=0
          for f in $(find . -name "cli.py" -path './phase*' | sort); do
            d=$(dirname "$f")
            echo "::group::$d"
            (cd "$d" && python cli.py verify) || { echo "::error::verification failed in $d"; status=1; }
            echo "::endgroup::"
          done
          exit $status
